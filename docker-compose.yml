# Local production-parity stack: MongoDB + Redis + API + web.
# Uses LOCAL MongoDB/Redis (not Atlas) so the whole loop runs offline.
# First run: docker compose up --build
services:
  mongo:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_DATABASE: priosync
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/priosync
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:8081
    ports:
      - "5000:5000"

  web:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    depends_on:
      - api
    ports:
      - "8081:80"

volumes:
  mongodata:
  redisdata:
